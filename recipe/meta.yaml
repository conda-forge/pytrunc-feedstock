{% set name = "pytrunc" %}
{% set version = "2.1.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytrunc/pytrunc-{{ version }}.tar.gz
  sha256: 64a95c7d9d5691f65d1d9becdac75f5c77357a2dd0655d2703f7f8e31ffea945

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - netcdf4
    - xarray

test:
  imports:
    - pytrunc
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/hygeos/pytrunc
  summary: Scattering phase matrix truncation Python tool for radiative transfer applications.
  license: Apache-2.0
  license_url: https://github.com/hygeos/pytrunc/blob/main/LICENSE.txt
  license_file: LICENSE.txt
  dev_url: https://github.com/hygeos/pytrunc

extra:
  recipe-maintainers:
    - musmoulana
